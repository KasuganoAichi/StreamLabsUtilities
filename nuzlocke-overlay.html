<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay - Nuzlocke & Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            color: #ffffff;
        }

        /* --- OVERLAY DE SLOTS & CONTADORES --- */
        .layout-container {
            display: grid;
            grid-template-columns: 130px 130px 256px; 
            column-gap: 22px;                                         
            row-gap: 34px;                                            
            padding: 20px;
            width: fit-content;
        }

        .bloco-slots {
            display: grid;
            grid-template-columns: 130px 130px;
            grid-column: 1 / 3;
            column-gap: 22px;
            row-gap: 34px;
        }

        .slot {
            width: 130px;
            height: 130px;
            /*border: 1px solid #000000; */
            background-color: transparent; 
            box-sizing: border-box;
            position: relative; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slot::before {
            content: attr(data-numero);
            position: absolute;
            top: 5px;
            left: 5px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 2;
        }

        .slot-texto {
            position: absolute;
            bottom: 5px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 120px;
            height: 30px;
            border: 1px solid #000000; 
            background-color: rgba(255, 255, 255, 0.8); 
            box-sizing: border-box;
            z-index: 2;
            
            /* Configurações do texto do Apelido */
            font-size: 15px;
            line-height: 30px;
            text-align: center;
            color: #000000;
            overflow: hidden;
            white-space: nowrap;
            font-weight: bold;
        }

        .contador-mortes {
            grid-column: 3;
            width: 256px;
            height: 201px;
            background-color: transparent;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.1s ease;
            margin-top: 233px; 
            position: relative;
        }

        .contador-titulo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        .contador-numero {
            font-size: 54px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-reset {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .btn-reset:hover {
            color: #ff3333;
            border-color: #ff3333;
        }

        /* --- PAINEL ASSISTENTE NUZLOCKE (300px ABAIXO) --- */
        .assistant-container {
            margin-top: 300px;
            margin-left: 20px;
            width: 600px;
            background-color: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        .assistant-title {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .assistant-section {
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
        }

        .assistant-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #cbd5e1;
        }

        select, input, button {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 10px;
            padding: 8px;
            background-color: #0f172a;
            border-left: 4px solid #10b981;
            font-weight: bold;
            font-size: 14px;
            color: #34d399;
            min-height: 20px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-line;
        }
    </style>
</head>

    <!-- BLOCO SUPERIOR (OVERLAY DA STREAM) -->
    <div class="layout-container">
        
        <!-- TIME 1 -->
        <div class="bloco-slots">
            <div class="slot" data-numero="1"><div class="slot-texto"></div></div>

        </div>

            <span class="btn-reset" onclick="event.stopPropagation(); zerarContador('mortesBloco1');">Zerar</span>
            <div class="contador-titulo">Mortes:</div>
            <div class="contador-numero" id="val-mortesBloco1">0</div>
        </div>

    </div>

    <div class="assistant-container">
        <div class="assistant-title">Digimon Nuzlocke Assistant</div>

        <!-- Opção 1: Pick from Specified Area -->
        <div class="assistant-section">
            <h4>1 - Roll a digimon from ONE Area</h4>
            <select id="selectArea" style="width: 70%;"></select>
            <button onclick="rollSingleArea()">Roll</button>
            <div class="result-box" id="resArea">...</div>
        </div>

        <!-- Opção 2: Pick from ALL Areas -->
        <div class="assistant-section">
            <h4>2 - Pick 1 Digimon from EACH Area</h4>
            <button onclick="rollAllAreas()">Roll All Areas</button>
            <div class="result-box" id="resAllAreas">...</div>
        </div>

        <!-- Opção 3: Pick Rookie by Attribute -->
        <div class="assistant-section">
            <h4>3 - Randomize Starter Digimon Options</h4>
            <button onclick="rollRookies()">Roll Rookies</button>
            <div class="result-box" id="resRookies">...</div>
        </div>

        <!-- Opção 4: Dice Roll -->
        <div class="assistant-section">
            <h4>4 - Roll Digivolution Dice</h4>
            <input type="number" id="diceMax" value="2" min="1" style="width: 60px;">
            <button onclick="rollDice()">Roll Dice</button>
            <div class="result-box" id="resDice">...</div>
        </div>
    </div>

            mortesBloco1: parseInt(localStorage.getItem('mortesBloco1')) || 0,
            mortesBloco2: parseInt(localStorage.getItem('mortesBloco2')) || 0
        };

        function atualizarTelaMortes() {
            document.getElementById('val-mortesBloco1').textContent = mortes.mortesBloco1;
            document.getElementById('val-mortesBloco2').textContent = mortes.mortesBloco2;
        }

        function alterarMortes(idContador, valor) {
            mortes[idContador] = Math.max(0, mortes[idContador] + valor);
            localStorage.setItem(idContador, mortes[idContador]);
            document.getElementById(`val-${idContador}`).textContent = mortes[idContador];
        }

        function zerarContador(idContador) {
            if (confirm("Deseja zerar este contador de mortes?")) {
                mortes[idContador] = 0;
                localStorage.setItem(idContador, 0);
                document.getElementById(`val-${idContador}`).textContent = 0;
            }
        }

        function carregarTime() {
            const slots = document.querySelectorAll('.slot');
            for (let i = 0; i < slots.length; i++) {
                const digimonConfig = meuTime[i];
                const labelTexto = slots[i].querySelector('.slot-texto');
                labelTexto.textContent = digimonConfig.apelido || "";

                if (!digimonConfig.nome || digimonConfig.nome.trim() === "") {
                    slots[i].style.backgroundImage = "none";
                    continue;
                }

                const nomeBusca = digimonConfig.nome.trim().toLowerCase();
                const idCorrespondente = dicionarioDigimon[nomeBusca];

                
                if (idCorrespondente) {
                    

                    if (idCorrespondente >= 1950 && idCorrespondente <= 1966) {
                        urlImagem = `portraits/ui_chara_icon_${idCorrespondente}.png`;
                    } else {
                        urlImagem = `https://api.skullbot.fr/digimon_ts/portraits/ui_chara_icon_${idCorrespondente}.webp`;
                    }

                    slots[i].style.backgroundImage = `url('${urlImagem}')`;
                } else {
                    slots[i].style.backgroundImage = "none";
                }
            }
        }

        atualizarTelaMortes();
        carregarTime();
