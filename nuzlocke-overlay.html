<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay - Nuzlocke & Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            color: #ffffff;
        }

        /* --- OVERLAY DE SLOTS & CONTADORES --- */
        .layout-container {
            display: grid;
            grid-template-columns: 130px 130px 256px; 
            column-gap: 22px;                                         
            row-gap: 34px;                                            
            padding: 20px;
            width: fit-content;
        }

        .bloco-slots {
            display: grid;
            grid-template-columns: 130px 130px;
            grid-column: 1 / 3;
            column-gap: 22px;
            row-gap: 34px;
        }

        .slot {
            width: 130px;
            height: 130px;
            /*border: 1px solid #000000; */
            background-color: transparent; 
            box-sizing: border-box;
            position: relative; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slot::before {
            content: attr(data-numero);
            position: absolute;
            top: 5px;
            left: 5px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 2;
        }

        .slot-texto {
            position: absolute;
            bottom: 5px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 120px;
            height: 30px;
            border: 1px solid #000000; 
            background-color: rgba(255, 255, 255, 0.8); 
            box-sizing: border-box;
            z-index: 2;
            
            /* Configurações do texto do Apelido */
            font-size: 15px;
            line-height: 30px;
            text-align: center;
            color: #000000;
            overflow: hidden;
            white-space: nowrap;
            font-weight: bold;
        }

        .contador-mortes {
            grid-column: 3;
            width: 256px;
            height: 201px;
            background-color: transparent;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.1s ease;
            margin-top: 233px; 
            position: relative;
        }

        .contador-titulo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        .contador-numero {
            font-size: 54px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-reset {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .btn-reset:hover {
            color: #ff3333;
            border-color: #ff3333;
        }

        /* --- PAINEL ASSISTENTE NUZLOCKE (300px ABAIXO) --- */
        .assistant-container {
            margin-top: 300px;
            margin-left: 20px;
            width: 540px;
            background-color: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        .assistant-title {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .assistant-section {
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
        }

        .assistant-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #cbd5e1;
        }

        select, input, button {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 10px;
            padding: 8px;
            background-color: #0f172a;
            border-left: 4px solid #10b981;
            font-weight: bold;
            font-size: 14px;
            color: #34d399;
            min-height: 20px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- BLOCO SUPERIOR (OVERLAY DA STREAM) -->
    <div class="layout-container">
        
        <!-- TIME 1 -->
        <div class="bloco-slots">
            <div class="slot" data-numero="1"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="4"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="2"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="5"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="3"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="6"><div class="slot-texto"></div></div>
        </div>

        <div class="contador-mortes" id="mortesBloco1" onclick="alterarMortes('mortesBloco1', 1)" oncontextmenu="alterarMortes('mortesBloco1', -1); return false;">
            <span class="btn-reset" onclick="event.stopPropagation(); zerarContador('mortesBloco1');">Zerar</span>
            <div class="contador-titulo">Mortes:</div>
            <div class="contador-numero" id="val-mortesBloco1">0</div>
        </div>

        <!-- TIME 2 -->
        <div class="bloco-slots">
            <div class="slot" data-numero="1"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="4"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="2"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="5"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="3"><div class="slot-texto"></div></div>
            <div class="slot" data-numero="6"><div class="slot-texto"></div></div>
        </div>

        <div class="contador-mortes" id="mortesBloco2" onclick="alterarMortes('mortesBloco2', 1)" oncontextmenu="alterarMortes('mortesBloco2', -1); return false;">
            <span class="btn-reset" onclick="event.stopPropagation(); zerarContador('mortesBloco2');">Zerar</span>
            <div class="contador-titulo">Mortes:</div>
            <div class="contador-numero" id="val-mortesBloco2">0</div>
        </div>

    </div>

    <!-- BLOCO INFERIOR (ASSISTENTE NUZLOCKE - 300px ABAIXO) -->
    <div class="assistant-container">
        <div class="assistant-title">Digimon Nuzlocke Assistant</div>

        <!-- Opção 1: Pick from Specified Area -->
        <div class="assistant-section">
            <h4>1 - Roll a digimon from ONE Area</h4>
            <select id="selectArea" style="width: 70%;"></select>
            <button onclick="rollSingleArea()">Roll</button>
            <div class="result-box" id="resArea">...</div>
        </div>

        <!-- Opção 2: Pick from ALL Areas -->
        <div class="assistant-section">
            <h4>2 - Pick 1 Digimon from EACH Area</h4>
            <button onclick="rollAllAreas()">Roll All Areas</button>
            <div class="result-box" id="resAllAreas">...</div>
        </div>

        <!-- Opção 3: Pick Rookie by Attribute -->
        <div class="assistant-section">
            <h4>3 - Randomize Starter Digimon Options</h4>
            <button onclick="rollRookies()">Roll Rookies</button>
            <div class="result-box" id="resRookies">...</div>
        </div>

        <!-- Opção 4: Dice Roll -->
        <div class="assistant-section">
            <h4>4 - Roll Digivolution Dice</h4>
            <input type="number" id="diceMax" value="2" min="1" style="width: 60px;">
            <button onclick="rollDice()">Roll Dice</button>
            <div class="result-box" id="resDice">...</div>
        </div>
    </div>

    <script>
        // ====================================================================
        // DADOS DO TXT (Áreas e Digimons)
        // ====================================================================
        const areasData = [
            { name: "Tokyo MGB: North Tower", digimons: ["Botamon","Punimon","Kuramon","Wanyamon","Kotemon","Gotsumon","Dracomon","ToyAgumon","Monodramon","Impmon","Gazimon","Tentomon","Keramon","Mushroomon"] },
            { name: "Tokyo MGB: South Tower", digimons: ["Kuramon","Motimon","Gotsumon","Keramon","Gazimon","Tentomon","ToyAgumon","Monodramon","Mushroomon","Impmon","Kurisarimon"] },
            { name: "Shinjuku Underground Waterway: South Block", digimons: ["Pagumon","Nyaromon","Bukamon","Wormmon","Tapirmon","Biyomon","Muchomon","Betamon","Numemon"] },
            { name: "Shinjuku Underground Waterway: North Block", digimons: ["Tsunomon","Tokomon","Tapirmon","Falcomon","Chuumon","Betamon","Lopmon","Dracmon","Geremon"] },
            { name: "Central Town: Spiral Waterway (Past)", digimons: ["Dorimon","Gazimon","Keramon","Otamamon","Penguimon","Snimon","Dokugumon","Drimogemon"] },
            { name: "Radio Tower (Past)", digimons: ["Kapurimon","Gazimon","ToyAgumon","Funbeemon","Otamamon","Shoutmon","Solarmon","Goblimon","Kudamon","Kotemon","Dracomon","Airdramon","Dokugumon","Snimon","Centaurumon","Waspmon","Tyranomon"] },
            { name: "Factorial Area (Past)", digimons: ["Choromon","Solarmon","Hagurumon","Shamamon","Kamemon","Gargomon","Mechanorimon","Clockmon","Guardromon"] },
            { name: "Abyss Surface (Past)", digimons: ["Syakomon","Crabmon","Penmon","Coelamon","KaratsukiNumemon"] },
            { name: "Abyss Depths (Past)", digimons: ["Poyomon","Penmon","Syakomon","Crabmon","Gomamon","KaratsukiNumemon","Octomon","Seadramon","Coelamon","Dagomon"] },
            { name: "Gear Forest (Past)", digimons: ["Pabumon","Muchomon","Tentomon","Floramon","Kabuterimon","Unimon","Gekomon","Flymon","Sunflowmon","Woodmon","Deramon"] },
            { name: "Tokyo (Past)", digimons: ["Goblimon","Shamamon","Kuwagamon","Kabuterimon","Flymon","Okuwamon","Divermon","Dagomon"] },
            { name: "Dark Crevasse (First Visit)", digimons: ["Kurisarimon","SkullGreymon","Infermon"] },
            { name: "Central Town: Spiral Waterway (Present)", digimons: ["Otamamon","Dokugumon","Kurisarimon","Deltamon","DeathMeramon","Parrotmon","Arukenimon"] },
            { name: "Radio Tower (Present)", digimons: ["Tyranomon"] },
            { name: "Abyss Surface (Present)", digimons: ["Sukamon","Raremon"] },
            { name: "Abyss Sanctuary (Present)", digimons: ["Gizamon","Anomalocarimon","MegaSeadramon","Zudomon","Plesiomon"] },
            { name: "Gear Forest (Present)", digimons: ["Lalamon","Muchomon","Floramon","Vegiemon","Kiwimon","Birdramon","Gekomon","Woodmon","MegaKabuterimon","Etemon","Lilamon","Garudamon","Deramon","CannonBeemon","ShogunGekomon","HeraklesKabuterimon"] },
            { name: "Temple of Light (Present)", digimons: ["Unimon", "Wisemon"] },
            { name: "Dark Crevasse (Present)", digimons: ["PicoDevimon","Sangloupmon","SkullGreymon","Infermon","Yatagaramon","Vamdemon","Piedmon"] },
            { name: "Cosmic Area: Heat", digimons: ["Solarmon","Meramon","MudFrigimon","Volcanomon","Meteormon","RizeGreymon"] },
            { name: "Cosmic Area: Chill", digimons: ["Penmon","Coredramon (Blue)","Yukidarumon","Mammon","BlueMeramon","Vikemon"] },
            { name: "Akashic Visions", digimons: ["FunBeemon","Waspmon","CannonBeemon","Cerberusmon"] },
            { name: "Outer Dungeons", digimons: ["Pabumon","Lalamon","PlatinumScumon","Witchmon","Reppamon","Ikkakumon","Wizarmon","Dinohumon","Andromon","CatchMamemon","MetalGreymon","Whamon","MetalTyranomon","Wingdramon","MagnaGarurumon","Orochimon","TyrantKabuterimon","Crossmon","Hououmon","Slayerdramon"] }
        ];

        const rookiesData = [
            { attribute: "Vaccine", digimons: ["Agumon","Kudamon","Gomamon","Coronamon","Zubamon","Solarmon","Terriermon","Tentomon","ToyAgumon","Tapirmon","Hyokomon","Biyomon","Falcomon","Salamon","Bearmon","Penmon","Monodramon","Ryudamon","Lucemon"] },
            { attribute: "Data", digimons: ["Elecmon","Gaomon","Crabmon","Gabumon","Kamemon","Kokuwamon","Gotsumon","Kotemon","Shoutmon","Dracomon","Dorumon","Patamon","Huckmon","Palmon","Floramon","Muchomon","Lalamon","Lunamon","Renamon","Lopmon"] },
            { attribute: "Virus/Free/Unkown", digimons: ["Impmon","Otamamon","Gazimon","Gizamon","Guilmon","Goblimon","Shamamon","Syakomon","SnowGoblimon","Chuumon","Dracmon","Hagurumon","PicoDevimon","FunBeemon","Betamon","Mushroomon","Agumon (Black)","Gabumon (Black)","Vmon","Armadimon","Hawkmon","Wormmon","Keramon"] }
        ];

        // Populando Select de Áreas
        const selectElem = document.getElementById('selectArea');
        areasData.forEach((area, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = area.name;
            selectElem.appendChild(opt);
        });

        // Função de Sorteio Genérica
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // --- 1. Sorteio de Área Única ---
        function rollSingleArea() {
            let idx = selectElem.value;
            let area = areasData[idx];
            let picked = getRandomItem(area.digimons);
            document.getElementById('resArea').innerText = `${picked}`;
        }

        // --- 2. Sorteio de Todas as Áreas (Sem Repetição) ---
        function rollAllAreas() {
            let resultText = "";
            let drawnDigimons = [];

            areasData.forEach(area => {
                let available = area.digimons.filter(d => !drawnDigimons.includes(d));
                let picked = available.length > 0 ? getRandomItem(available) : getRandomItem(area.digimons);
                drawnDigimons.push(picked);
                resultText += `${area.name} : ${picked}\n`;
            });

            document.getElementById('resAllAreas').innerText = resultText;
        }

        // --- 3. Sorteio por Atributo ---
        function rollRookies() {
            let resultText = "";
            rookiesData.forEach(group => {
                let picked = getRandomItem(group.digimons);
                resultText += `${group.attribute} : ${picked}\n`;
            });
            document.getElementById('resRookies').innerText = resultText;
        }

        // --- 4. Rolagem de Dado ---
        function rollDice() {
            let max = parseInt(document.getElementById('diceMax').value) || 1;
            let roll = Math.floor(Math.random() * max) + 1;
            document.getElementById('resDice').innerText = `${roll}`;
        }

        // ====================================================================
        // OVERLAY SLOTS & TIMES
        // ====================================================================
        const dicionarioDigimon = {
            "agumon": "1151", "gabumon": "1002", "patamon": "1003",
            "gatomon": "1155", "guilmon": "1005", "terriermon": "1006",
            "renamon": "1007", "wargreymon": "1200"
        };

        const meuTime = [
            { nome: "Agumon", apelido: "Faísca" }, { nome: "Gabumon", apelido: "Fubá" },
            { nome: "Patamon", apelido: "Pipoca" }, { nome: "", apelido: "" },
            { nome: "", apelido: "" }, { nome: "", apelido: "" },
            { nome: "Guilmon", apelido: "Dino" }, { nome: "", apelido: "" },
            { nome: "", apelido: "" }, { nome: "", apelido: "" },
            { nome: "", apelido: "" }, { nome: "", apelido: "" }                  
        ];

        const mortes = {
            mortesBloco1: parseInt(localStorage.getItem('mortesBloco1')) || 0,
            mortesBloco2: parseInt(localStorage.getItem('mortesBloco2')) || 0
        };

        function atualizarTelaMortes() {
            document.getElementById('val-mortesBloco1').textContent = mortes.mortesBloco1;
            document.getElementById('val-mortesBloco2').textContent = mortes.mortesBloco2;
        }

        function alterarMortes(idContador, valor) {
            mortes[idContador] = Math.max(0, mortes[idContador] + valor);
            localStorage.setItem(idContador, mortes[idContador]);
            document.getElementById(`val-${idContador}`).textContent = mortes[idContador];
        }

        function zerarContador(idContador) {
            if (confirm("Deseja zerar este contador de mortes?")) {
                mortes[idContador] = 0;
                localStorage.setItem(idContador, 0);
                document.getElementById(`val-${idContador}`).textContent = 0;
            }
        }

        function carregarTime() {
            const slots = document.querySelectorAll('.slot');
            for (let i = 0; i < slots.length; i++) {
                const digimonConfig = meuTime[i];
                const labelTexto = slots[i].querySelector('.slot-texto');
                labelTexto.textContent = digimonConfig.apelido || "";

                if (!digimonConfig.nome || digimonConfig.nome.trim() === "") {
                    slots[i].style.backgroundImage = "none";
                    continue;
                }

                const nomeBusca = digimonConfig.nome.trim().toLowerCase();
                const idCorrespondente = dicionarioDigimon[nomeBusca];

                if (idCorrespondente) {
                    const urlImagem = `https://api.skullbot.fr/digimon_ts/portraits/ui_chara_icon_${idCorrespondente}.webp`;
                    slots[i].style.backgroundImage = `url('${urlImagem}')`;
                } else {
                    slots[i].style.backgroundImage = "none";
                }
            }
        }

        atualizarTelaMortes();
        carregarTime();
    </script>
</body>
</html>
