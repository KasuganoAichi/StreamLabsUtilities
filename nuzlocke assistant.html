<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay - Nuzlocke & Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            color: #ffffff;
        }

        .assistant-container {
            margin-top: 20px;
            margin-left: 600px;
            width: 600px;
            background-color: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        .assistant-title {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .assistant-section {
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
        }

        .assistant-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #cbd5e1;
        }

        select, input, button {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 10px;
            padding: 8px;
            background-color: #0f172a;
            border-left: 4px solid #05744f;
            font-weight: bold;
            font-size: 14px;
            color: #05744f;
            min-height: 20px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <div class="assistant-container">
        <div class="assistant-title">Digimon Nuzlocke Assistant</div>

        <!-- Option 1: Choose a Digimon from a designated area -->
        <div class="assistant-section">
            <h4>1 - Roll a digimon from ONE Area</h4>
            <select id="selectArea" style="width: 70%;"></select>
            <button onclick="rollSingleArea()">Roll</button>
            <div class="result-box" id="resArea">...</div>
        </div>

        <!-- Option 2: Pick one Digimon from EACH area with no dups -->
        <div class="assistant-section">
            <h4>2 - Pick 1 Digimon from EACH Area</h4>
            <button onclick="rollAllAreas()">Roll</button>
            <div class="result-box" id="resAllAreas">...</div>
        </div>

        <!-- Option 3: Pick a set of Rookies -->
        <div class="assistant-section">
            <h4>3 - Randomize Starter Digimon Options</h4>
            <button onclick="rollRookies()">Roll</button>
            <div class="result-box" id="resRookies">...</div>
        </div>

        <!-- Option 4: Dice Roll -->
        <div class="assistant-section">
            <h4>4 - Roll Digivolution Dice</h4>
            <input type="number" id="diceMax" value="2" min="1" style="width: 60px;">
            <button onclick="rollDice()">Roll</button>
            <div class="result-box" id="resDice">...</div>
        </div>
    </div>

    <script>
        // ====================================================================
        // AREAS AND DIGIMONS 
        // You can add your own named areas or list inside this const
        // However, if the list grows to big it may not work anymore since it is using your machines RAM
        // (NOTE: Those aren't all the named areas in game/load zones, but the ones
        // I designed to make for a smaller overall amount of Digimon to be obtained)
        // ====================================================================
        const areasData = [
            { name: "Tokyo Metropolitan Goverment Building: North Tower", digimons: ["Botamon","Punimon","Kuramon","Wanyamon","Kotemon","Gotsumon","Dracomon","ToyAgumon","Monodramon","Impmon","Gazimon","Tentomon","Keramon","Mushroomon"] },
            { name: "Tokyo Metropolitan Goverment Building: South Tower", digimons: ["Kuramon","Motimon","Gotsumon","Keramon","Gazimon","Tentomon","ToyAgumon","Monodramon","Mushroomon","Impmon","Kurisarimon"] },
            { name: "Shinjuku Underground Waterway: South Block", digimons: ["Pagumon","Nyaromon","Bukamon","Wormmon","Tapirmon","Biyomon","Muchomon","Betamon","Numemon"] },
            { name: "Shinjuku Underground Waterway: North Block", digimons: ["Tsunomon","Tokomon","Tapirmon","Falcomon","Chuumon","Betamon","Lopmon","Dracmon","Geremon"] },
            { name: "Central Town: Spiral Waterway (Past)", digimons: ["Dorimon","Gazimon","Keramon","Otamamon","Penguimon","Snimon","Dokugumon","Drimogemon"] },
            { name: "Radio Tower (Past)", digimons: ["Kapurimon","Gazimon","ToyAgumon","Funbeemon","Otamamon","Shoutmon","Solarmon","Goblimon","Kudamon","Kotemon","Dracomon","Airdramon","Dokugumon","Snimon","Centaurumon","Waspmon","Tyranomon"] },
            { name: "Factorial Area (Past)", digimons: ["Choromon","Solarmon","Hagurumon","Shamamon","Kamemon","Gargomon","Mechanorimon","Clockmon","Guardromon"] },
            { name: "Abyss Surface (Past)", digimons: ["Syakomon","Crabmon","Penmon","Coelamon","KaratsukiNumemon"] },
            { name: "Abyss Depths (Past)", digimons: ["Poyomon","Penmon","Syakomon","Crabmon","Gomamon","KaratsukiNumemon","Octomon","Seadramon","Coelamon","Dagomon"] },
            { name: "Gear Forest (Past)", digimons: ["Pabumon","Muchomon","Tentomon","Floramon","Kabuterimon","Unimon","Gekomon","Flymon","Sunflowmon","Woodmon","Deramon"] },
            { name: "Tokyo (Past)", digimons: ["Goblimon","Shamamon","Kuwagamon","Kabuterimon","Flymon","Okuwamon","Divermon","Dagomon"] },
            { name: "Dark Crevasse (First Visit)", digimons: ["Kurisarimon","SkullGreymon","Infermon"] },
            { name: "Central Town: Spiral Waterway (Present)", digimons: ["Otamamon","Dokugumon","Kurisarimon","Deltamon","DeathMeramon","Parrotmon","Arukenimon"] },
            { name: "Radio Tower (Present)", digimons: ["Tyranomon"] },
            { name: "Abyss Surface (Present)", digimons: ["Sukamon","Raremon"] },
            { name: "Abyss Sanctuary (Present)", digimons: ["Gizamon","Anomalocarimon","MegaSeadramon","Zudomon","Plesiomon"] },
            { name: "Gear Forest (Present)", digimons: ["Lalamon","Muchomon","Floramon","Vegiemon","Kiwimon","Birdramon","Gekomon","Woodmon","MegaKabuterimon","Etemon","Lilamon","Garudamon","Deramon","CannonBeemon","ShogunGekomon","HeraklesKabuterimon"] },
            { name: "Temple of Light (Present)", digimons: ["Unimon", "Wisemon"] },
            { name: "Dark Crevasse (Present)", digimons: ["PicoDevimon","Sangloupmon","SkullGreymon","Infermon","Yatagaramon","Vamdemon","Piedmon"] },
            { name: "Cosmic Area: Heat", digimons: ["Solarmon","Meramon","MudFrigimon","Volcanomon","Meteormon","RizeGreymon"] },
            { name: "Cosmic Area: Chill", digimons: ["Penmon","Coredramon (Blue)","Yukidarumon","Mammon","BlueMeramon","Vikemon"] },
            { name: "Akashic Visions", digimons: ["FunBeemon","Waspmon","CannonBeemon","Cerberusmon"] },
            { name: "Outer Dungeons", digimons: ["Pabumon","Lalamon","PlatinumScumon","Witchmon","Reppamon","Ikkakumon","Wizarmon","Dinohumon","Andromon","CatchMamemon","MetalGreymon","Whamon","MetalTyranomon","Wingdramon","MagnaGarurumon","Orochimon","TyrantKabuterimon","Crossmon","Hououmon","Slayerdramon"] }
        ];

        // List of the Rookie Digimon in-game by Attribute
        // (NOTE: Terriermon Assistant is not a part of the list because the game treats it as a Mode Change from Terriermon)
        const rookiesData = [
            { attribute: "Vaccine", digimons: ["Agumon","Kudamon","Gomamon","Coronamon","Zubamon","Solarmon","Terriermon","Tentomon","ToyAgumon","Tapirmon","Hyokomon","Biyomon","Falcomon","Salamon","Bearmon","Penmon","Monodramon","Ryudamon","Lucemon"] },
            { attribute: "Data", digimons: ["Elecmon","Gaomon","Crabmon","Gabumon","Kamemon","Kokuwamon","Gotsumon","Kotemon","Shoutmon","Dracomon","Dorumon","Patamon","Huckmon","Palmon","Floramon","Muchomon","Lalamon","Lunamon","Renamon","Lopmon"] },
            { attribute: "Virus/Free/Unkown", digimons: ["Impmon","Otamamon","Gazimon","Gizamon","Guilmon","Goblimon","Shamamon","Syakomon","SnowGoblimon","Chuumon","Dracmon","Hagurumon","PicoDevimon","FunBeemon","Betamon","Mushroomon","Agumon (Black)","Gabumon (Black)","Vmon","Armadimon","Hawkmon","Wormmon","Keramon"] }
        ];

        // Create DOM for selectArea
        const selectElem = document.getElementById('selectArea');
        areasData.forEach((area, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = area.name;
            selectElem.appendChild(opt);
        });

        // Random Function
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Choose random Digimon from choosen area
        function rollSingleArea() {
            let idx = selectElem.value;
            let area = areasData[idx];
            let picked = getRandomItem(area.digimons);
            document.getElementById('resArea').innerText = `${picked}`;
        }

        // Choose one random digimon from each area without duplicates
        function rollAllAreas() {
            let resultText = "";
            let drawnDigimons = [];

            areasData.forEach(area => {
                let available = area.digimons.filter(d => !drawnDigimons.includes(d));
                let picked = available.length > 0 ? getRandomItem(available) : getRandomItem(area.digimons);
                drawnDigimons.push(picked);
                resultText += `${area.name} : ${picked}\n`;
            });

            document.getElementById('resAllAreas').innerText = resultText;
        }

        // Randomize the three starter options (NOTE: You will need to use a mod in order to change this for your game)
        function rollRookies() {
            let resultText = "";
            rookiesData.forEach(group => {
                let picked = getRandomItem(group.digimons);
                resultText += `${group.attribute} : ${picked}\n`;
            });
            document.getElementById('resRookies').innerText = resultText;
        }

        // Roll a Dice (I could not be bothered to create a huge database with all the digivolution of each Digimon, a dice is enough)
        function rollDice() {
            let max = parseInt(document.getElementById('diceMax').value) || 1;
            let roll = Math.floor(Math.random() * max) + 1;
            document.getElementById('resDice').innerText = `${roll}`;
        }
    </script>
</body>
</html>
